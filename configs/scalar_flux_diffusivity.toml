# Configuration for tools/run_scalar_flux_diffusivity.py
# Conventions: arrays are (t, y, x); x = cross-stream (u), y = streamwise grid coordinate (v), w out of plane.
# Downstream distance s = y_max - y (source at the high-row end).

[paths]
base = "E:/sPIV_PLIF_ProcessedData"
output_root = "E:/sPIV_PLIF_ProcessedData/scalar_flux_diffusivity"
# Path templates relative to `base`; {case} is replaced by the case name.
plif = "PLIF/{case}_PLIF.npy"
u = "PIV/Interpolated_to_PLIF/piv_{case}_u.npy"
v = "PIV/Interpolated_to_PLIF/piv_{case}_v.npy"
w = "PIV/Interpolated_to_PLIF/piv_{case}_w.npy"
xgrid = "PLIF/{case}_xgrid.npy"
ygrid = "PLIF/{case}_ygrid.npy"
# Integral length scale maps [m] from src/.../analysis/ILS_mpi_from_npy.py, read directly from the zip (step 5).
# Longitudinal scales: L_u along x (u_cross_stream) for K_x, L_v along y (v_streamwise) for K_y.
ils = "flow_properties/Integral_length_scales/ILS.zip"
ils_zip = "flow_properties/Integral_length_scales/ILS.zip"
ils_x_member = "ILS_{case}_u_cross_stream.npy"
ils_y_member = "ILS_{case}_v_streamwise.npy"

[cases]
run = ["buoyant"]  # cases to process; available: baseline, buoyant, diffusive, fractal, nearbed, smSource

# Per-case overrides. molecular_diffusivity_m2s (optional) enables K/D; skipped and reported when absent.
[cases.baseline]
# baseline_PLIF.npy is stored upside down relative to its PIV stacks and to the other cases (Oct 2026 check:
# PLIF matches buoyant only when flipped, r = 0.98; velocity matches unflipped, r = 0.95). Flipped on read.
flip_plif_rows = true

[stream]
dt_s = 0.05
source_at_high_row = true
chunk_frames = 20
base_block_frames = 20          # 1 s base blocks; bootstrap block length is a multiple of this
coarse_stride = 8               # pixels; time series kept on this sub-grid for integral time scales
w_outlier_threshold = -1.0      # existing repo rule: w' < -1 m/s -> NaN
min_valid_frames = 500
keep_block_sums = true          # ~13 GB per case; needed to rerun the bootstrap or half-record checks
prepass_frame_stride = 20       # frames used for the quick mean-C estimate that places the points

[uncertainty]
n_boot = 500
block_factor = 2.0              # block length = factor * percentile(T_int) over the plume region
block_percentile = 95.0
block_basis = ["c", "uc", "vc"] # integral time scales considered for the block length (max over these)
plume_c_threshold = 0.02        # mean C above this defines the plume region (= intermittency threshold used elsewhere)
significance_factor = 2.0       # pixel significant if |flux| >= factor * SE (1 SE -> ~32% false positives)
rho_min_c_rms = 0.0             # c_rms floor for rho; 0 -> 3 * PLIF noise std
rho_min_vel_rms = 0.002         # m/s
seed = 12345

[noise]
background_strips_mm = [[-100.0, -80.0], [80.0, 100.0]]  # as in tools/compute_bg_percentiles.py

[gradients]
method = "gaussian"
smoothing_sigmas_mm = [1.0, 2.0, 4.0]
primary_sigma_mm = 2.0
sensitivity_stations_mm = [50.0, 150.0, 250.0]  # downstream distances for profile comparisons

[diffusion]
plume_n_sigma = 2.5             # plume region: C - background > plume_c_threshold and |x - x_c| <= n sigma_x
width_method = "gaussian"       # sigma_x, x_c for the plume region, eta and sigma/L: "gaussian" (fit + offset) or "moment";
                                # the second moment is inflated by faint wide skirts (smSource 17 mm vs ~2 mm at the source)
station_centers_mm = [25.0, 50.0, 100.0, 150.0, 200.0, 250.0]  # scatter-panel stations (downstream distance s)
station_width_mm = 10.0
profile_bin_start_mm = 15.0     # streamwise bins for the summary curves
profile_bin_stop_mm = 285.0
profile_bin_width_mm = 10.0
gradient_mask_frac = 0.1        # mask where |dC/dq| < frac * max|grad C| ...
gradient_mask_mode = "row"      # ... with the max taken per row ("row") or over the field ("global")
window_mm = 5.0                 # windowed K regression window
tensor_window_mm = 8.0
tensor_cond_max = 30.0
# anisotropic y-smoothing of the mean field (PLIF striation ripple) is tested in step 9, not applied by default

[spreading]
taylor_window_mm = 30.0          # Savitzky-Golay window for d(sigma^2)/ds
flux_moment_band_sigma = 4.0     # integrate the flux moment over |x - x_c| <= this * sigma_x (converged by 3-4 sigma)
max_valid_s_mm = 240.0           # widths unreliable closer to the image edge (fit offset and sigma diverge there)
reference_s_mm = 30.0            # mass-flux normalization station
conservation_check_from_mm = 60.0
mass_flux_tolerance = 0.15       # flag s beyond which |Q/Q_ref - 1| exceeds this

[spectra]
nperseg = 256                    # 12.8 s segments at 20 Hz -> df = 0.078 Hz, ~46 segments with 50% overlap
ci = 0.95

[overlay]
quiver_stride_mm = 8.0

[robustness]
anisotropic_sigma_y_mm = [3.0, 5.0, 8.0]   # with sigma_x = primary_sigma_mm (PLIF striation test)
gradient_mask_fracs = [0.05, 0.1, 0.2]
significance_factors = [1.0, 2.0, 3.0]
summary_s_min_mm = 50.0
summary_s_max_mm = 240.0

[figures]
dpi = 300

# Representative points: downstream distance s and either x_offset_sigma (relative to the plume centroid, in
# units of the local second-moment width) or absolute x_mm.
[[points]]
name = "centerline_near"
downstream_mm = 30.0
x_offset_sigma = 0.0

[[points]]
name = "centerline_mid"
downstream_mm = 150.0
x_offset_sigma = 0.0

[[points]]
name = "centerline_far"
downstream_mm = 270.0
x_offset_sigma = 0.0

[[points]]
name = "edge_mid"
downstream_mm = 150.0
x_offset_sigma = 2.0

[[points]]
name = "edge_far"
downstream_mm = 270.0
x_offset_sigma = 2.0
